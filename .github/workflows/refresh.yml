name: Refresh M3U

on:
  schedule:
    # Every 15 min. TVP signs HLS tokens with a ~15–30 min lifetime, so a
    # 30-min cadence guarantees a dead window near the end of each cycle.
    # GitHub may delay scheduled runs under load; using off-peak minutes
    # reduces contention without changing the cadence.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-tvp
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-slim
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        # zizmor: ignore[artipacked] this job commits & pushes refreshed streams, so it needs persisted creds
        uses: actions/checkout@v7

      - name: Generate playlists
        # Pure-stdlib Python (urllib) — no extra dependencies needed.
        # On a transient TVP API failure generate.py reuses the channel's
        # last-known-good URL instead of writing a placeholder, so a single
        # flaky fetch no longer takes a channel dark.
        run: python3 generate.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add streams/
          git diff --cached --quiet || git commit -m "chore: refresh streams [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
