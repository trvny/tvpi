name: Residential push release

on:
  push:
    branches: [main]
    paths:
      - "scripts/residential_push.py"
      - "scripts/configure_windows_task.ps1"
      - "scripts/install_residential_push.ps1"
      - "scripts/install_residential_push.cmd"
      - "scripts/install_residential_push_linux.sh"
      - ".github/workflows/residential-push-release.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/residential_push.py"
      - "scripts/configure_windows_task.ps1"
      - "scripts/install_residential_push.ps1"
      - "scripts/install_residential_push.cmd"
      - "scripts/install_residential_push_linux.sh"
      - ".github/workflows/residential-push-release.yml"
  workflow_dispatch:

concurrency:
  group: residential-push-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build helper
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          pyinstaller --clean --onefile --name tvpi-residential-push scripts/residential_push.py

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item dist/tvpi-residential-push.exe package/
          Copy-Item scripts/install_residential_push.cmd package/install.cmd
          Copy-Item scripts/install_residential_push.ps1 package/
          Copy-Item scripts/configure_windows_task.ps1 package/
          Compress-Archive -Path package/* -DestinationPath tvpi-residential-push-windows-x64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: tvpi-residential-push-windows-x64
          path: tvpi-residential-push-windows-x64.zip
          if-no-files-found: error

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build helper
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          pyinstaller --clean --onefile --name tvpi-residential-push scripts/residential_push.py

      - name: Smoke test
        shell: bash
        run: |
          bash -n scripts/install_residential_push_linux.sh
          set +e
          output="$(./dist/tvpi-residential-push 2>&1)"
          status=$?
          set -e
          test "$status" -eq 1
          grep -q "TVPI_PUSH_TOKEN not set" <<< "$output"

      - name: Package
        shell: bash
        run: |
          mkdir package
          install -m 0755 dist/tvpi-residential-push package/tvpi-residential-push
          install -m 0755 scripts/install_residential_push_linux.sh package/install.sh
          tar -C package -czf "tvpi-residential-push-linux-${{ matrix.arch }}.tar.gz" .

      - uses: actions/upload-artifact@v7
        with:
          name: tvpi-residential-push-linux-${{ matrix.arch }}
          path: tvpi-residential-push-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tvpi-residential-push-windows-x64
          path: .

      - uses: actions/download-artifact@v8
        with:
          name: tvpi-residential-push-linux-x64
          path: .

      - uses: actions/download-artifact@v8
        with:
          name: tvpi-residential-push-linux-arm64
          path: .

      - name: Publish rolling release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="residential-push-latest"
          assets=(
            tvpi-residential-push-windows-x64.zip
            tvpi-residential-push-linux-x64.tar.gz
            tvpi-residential-push-linux-arm64.tar.gz
          )
          set_tag_ref() {
            if ! gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" \
              -f sha="$GITHUB_SHA" \
              -F force=true >/dev/null 2>&1; then
              gh api --method POST \
                "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$tag" \
                -f sha="$GITHUB_SHA" >/dev/null
            fi
          }

          cat > release-notes.md <<'EOF_NOTES'
          Residential volunteer for TVPI.

          Windows x64: extract the ZIP and double-click `install.cmd`.
          Linux x64/arm64: extract the tarball and run `./install.sh` as your normal user. Linux binaries require glibc 2.35+.

          New installations generate a unique local credential and show a public `Volunteer ID`; send that ID for one-time approval. The private credential stays on the machine. Existing installations keep their credential. The scheduled refresh runs every 12 minutes.
          EOF_NOTES

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" \
              --target "$GITHUB_SHA" \
              --title "TVPI residential volunteer" \
              --notes-file release-notes.md
            set_tag_ref
          else
            set_tag_ref
            gh release create "$tag" \
              "${assets[@]}" \
              --verify-tag \
              --title "TVPI residential volunteer" \
              --notes-file release-notes.md
          fi
