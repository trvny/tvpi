name: Residential push release

on:
  push:
    branches: [main]
    paths:
      - "scripts/residential_push.py"
      - "scripts/configure_windows_task.ps1"
      - "scripts/install_residential_push.ps1"
      - "scripts/install_residential_push.cmd"
      - ".github/workflows/residential-push-release.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/residential_push.py"
      - "scripts/configure_windows_task.ps1"
      - "scripts/install_residential_push.ps1"
      - "scripts/install_residential_push.cmd"
      - ".github/workflows/residential-push-release.yml"
  workflow_dispatch:

concurrency:
  group: residential-push-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build helper
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          pyinstaller --clean --onefile --name tvpi-residential-push scripts/residential_push.py

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item dist/tvpi-residential-push.exe package/
          Copy-Item scripts/install_residential_push.cmd package/install.cmd
          Copy-Item scripts/install_residential_push.ps1 package/
          Copy-Item scripts/configure_windows_task.ps1 package/
          Compress-Archive -Path package/* -DestinationPath tvpi-residential-push-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: tvpi-residential-push-windows-x64
          path: tvpi-residential-push-windows-x64.zip
          if-no-files-found: error

      - name: Publish rolling release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "residential-push-latest"
          $notes = @'
          Windows x64 residential volunteer for TVPI.

          Extract the ZIP and double-click `install.cmd`. New installations generate a unique local credential and show a public `Volunteer ID`; send that ID for one-time approval. The private credential stays DPAPI-protected on that PC. Existing installations keep their credential. The scheduled task refreshes every 12 minutes.
          '@
          Set-Content -Path release-notes.md -Value $notes -Encoding UTF8

          $previousPreference = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          gh release view $tag --json tagName 2>$null | Out-Null
          $releaseExists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = $previousPreference

          if ($releaseExists) {
            gh release delete $tag --yes
            gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag"
          }

          gh release create $tag `
            tvpi-residential-push-windows-x64.zip `
            --target $env:GITHUB_SHA `
            --title "TVPI residential volunteer" `
            --notes-file release-notes.md
