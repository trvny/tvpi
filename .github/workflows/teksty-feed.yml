name: Teksty feed tests

on:
  push:
    branches: [main]
    paths:
      - "functions/_shared/shitpost.js"
      - "functions/teksty/feed.xml.js"
      - "tests/teksty-feed.test.mjs"
      - ".github/workflows/teksty-feed.yml"
  pull_request:
    branches: [main]
    paths:
      - "functions/_shared/shitpost.js"
      - "functions/teksty/feed.xml.js"
      - "tests/teksty-feed.test.mjs"
      - ".github/workflows/teksty-feed.yml"

permissions:
  contents: read

jobs:
  atom:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: node --test tests/teksty-feed.test.mjs
