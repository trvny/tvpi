# MegaLinter configuration
# Docs: https://megalinter.io/latest/config-file/
---
FLAVOR_SUGGESTIONS: false
SECURITY_SUGGESTIONS: false
APPLY_FIXES: all
# Formatter output in the report artifact can be used as ready-made patches.
# Review and apply useful fixes selectively; accepting every fix is optional.
REPORTERS_MARKDOWN_TYPE: simple

# REPOSITORY: secret/SAST scanning - GitHub secret scanning + Dependabot
#   already cover this here
# SPELL: cspell - not useful for this repo's content
# COPYPASTE: jscpd - not useful for this repo's size
DISABLE:
  - REPOSITORY
  - SPELL
  - COPYPASTE

# ACTION_ZIZMOR: now enabled and green (see below + .github/zizmor.yml).
#   Runs offline; unpinned-uses waived to ref-pin; artipacked fixed via
#   persist-credentials (deploy) or waived inline where the job pushes (refresh).
# SQL_TSQLLINT: MegaLinter's only SQL linter defaults to T-SQL (MSSQL)
#   dialect - worker/migrations is SQLite (D1), every "fix" it wants is wrong.
# TYPESCRIPT_STANDARD: can't locate worker/tsconfig.json from repo root;
#   revisit with an explicit --project arg if you want this back.
# JAVASCRIPT_STANDARD: standardjs mandates semicolon-free style; this codebase
#   uses semicolons and prettier formatting throughout, so it would report the
#   whole of functions/ as wrong. JS is covered instead by JAVASCRIPT_ES
#   (correctness, see eslint.config.mjs) and JAVASCRIPT_PRETTIER (formatting).
# TYPESCRIPT_ES / JSX_ESLINT / TSX_ESLINT: adding eslint.config.mjs activates
#   these too, and they would lint worker/*.ts with a weaker opinion than the
#   `npm run typecheck` that deploy.yml already runs against worker/tsconfig.json.
DISABLE_LINTERS:
  - SQL_TSQLLINT
  - TYPESCRIPT_STANDARD
  - JAVASCRIPT_STANDARD
  - TYPESCRIPT_ES
  - JSX_ESLINT
  - TSX_ESLINT

# Activates JAVASCRIPT_PRETTIER. The default (`standard`) skips it entirely,
# which is half of why no JavaScript linter ran here at all.
JAVASCRIPT_DEFAULT_STYLE: prettier

# djlint waivers, each one measured against this site rather than assumed:
# H020 "empty tag pair" - the 14 hits are placeholders (#tvchips, #rows,
#   #wxwarn, #wxtemp ...) that functions/_middleware.js fills at request time
#   via HTMLRewriter. Removing them, as djlint suggests, breaks the page.
# H008 "attributes should be double quoted" - all 7 hits are inside the
#   data:image/svg+xml favicon, where the SVG sits in a double-quoted href
#   and its own attributes MUST use single quotes or the attribute terminates.
# H021 "inline styles should be avoided" - deliberate in a teletext layout.
# H031 "consider adding meta keywords" - Google has ignored meta keywords
#   since 2009; adding them would be cargo cult.
# H023 "do not use entity references" is NOT waived: it was right, and the
#   39 hits were fixed by writing the characters literally in UTF-8.
HTML_DJLINT_ARGUMENTS:
  - "--ignore=H008,H020,H021,H031"

# ACTION_ZIZMOR: run offline (no GitHub API -> no ref-confusion crash) and
#   fail CI only on low+ severity. See .github/zizmor.yml for the ref-pin policy.
ACTION_ZIZMOR_ARGUMENTS:
  - "--offline"
  - "--min-severity=low"

FILTER_REGEX_EXCLUDE: "(package-lock\\.json|streams/.*\\.m3u|favicon\\.ico)"
