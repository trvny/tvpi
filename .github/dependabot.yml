version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "21:37"
      timezone: "Europe/Warsaw"
    groups:
      actions:
        patterns: ["*"]

  # Worker build toolchain, exact-pinned in worker/package.json (wrangler,
  # typescript). Dependabot bumps those pins via grouped weekly PRs.
  - package-ecosystem: "npm"
    directory: "/worker"
    schedule:
      interval: "weekly"
      time: "21:37"
      timezone: "Europe/Warsaw"
    groups:
      worker-toolchain:
        patterns: ["*"]
